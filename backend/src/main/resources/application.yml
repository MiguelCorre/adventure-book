spring:
  application:
    name: adventure-book

  datasource:
    url: jdbc:h2:file:./data/adventure;AUTO_SERVER=TRUE
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

adventure:
  # Directory scanned for book JSON files. Relative paths resolve against the
  # working directory, which is `backend/` when running via the Maven plugin.
  books-dir: ../books
  # Health points every player starts with, and the ceiling GAIN_HEALTH cannot exceed.
  starting-health: 10

logging:
  level:
    com.adventurebook: INFO
