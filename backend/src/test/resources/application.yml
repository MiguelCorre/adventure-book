spring:
  datasource:
    url: jdbc:h2:mem:adventure-test;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false

# NOTE: this file shadows src/main/resources/application.yml entirely during tests
# (same classpath resource name), so it must be complete rather than a set of overrides.
adventure:
  # HTTP play-through tests use the valid upload samples. The default production catalogue
  # deliberately contains only the four supplied (invalid) assessment books.
  books-dir: ../upload-samples
  starting-health: 10
